services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: metronome-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-metronome}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metronome}
      POSTGRES_DB: ${POSTGRES_DB:-metronome}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - metronome_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-metronome} -d ${POSTGRES_DB:-metronome}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: metronome-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-metronome}:${POSTGRES_PASSWORD:-metronome}@postgres:5432/${POSTGRES_DB:-metronome}
      TICKETMASTER_API_KEY: ${TICKETMASTER_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  metronome_pgdata:
